<!DOCTYPE html>
<html>
  <head>
    <meta charset ="utf-8">;
  </head>
  <body>
    <form>
        sayi:<input type="text" id="sayi"><br>
        karesi: <span id="sonuc"></span><br>
        <input type="button" value="Hesapla" onclick="karesi()">
    </form>
    <script>
        function karesi(){
            var sayi=document.getElementById("sayi").value;
            var kare=sayi*sayi;
            document.getElementById("sonuc").innerHTML=kare;
        }

        
    </script>
  </body>
</html>
