<!DOCTYPE html>
<html>
  <head>
    <meta charset ="utf-8">;
  </head>
  <body>
    <script>
        //değişkenleri tanıma
        var r , alan, cevre, pi=3.14;

        //yarıçapı al
        r=Number(prompt("yarıçap: "));

        //yariçap sorgulama / işlem
        if(r<=0)
        alert("r pozitif olmalı!!! F% ile yeni r alın...");

        else {
            alan=pi*r*r;
            cevre=2*pi*r;
            alert("Alan="+alan+ "Çevre="+ cevre);
        }
    </script>
  </body>
</html>
