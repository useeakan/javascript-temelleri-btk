<!DOCTYPE html>
<html>
  <head>
    <meta charset ="utf-8">;
  </head>
  <body>
    <script>
        //dizi oluştur
        var sayilar=new Array();

        //dizi elemanı sayısı
        var n=prompt("dizi eleman sayısı:");

        //dizi elemanlarını ekrana al
        for(var i=0; i<n; i++);
         toplam=toplam+sayilar[i];
        
        //ortalama hesabı
        ortalama=toplam/n;

        //ortalamayı yaz
        document.write("ortalama="+ortalama);
        
    </script>
  </body>
</html>
