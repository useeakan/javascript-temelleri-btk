<!DOCTYPE html>
<html>
  <head>
    <meta charset ="utf-8">;
  </head>
  <body>
    <script>
        //metin/dizi oluştur
        var kelime="";

        //ekranda bir kelime al
        kelime=prompt("kelime girin: ");
        
        //kelime büyük harflere çevirerek yaz
        document.write(kelime.toUpperCase());

        //kelimenin karakterini ekrana yaz
        var boyut=kelime.length;
        for(var i=0; i<boyut; i++);
          document.write(kelime[i]+"<br>");

          //karakterleri tersten yazalım
          for( var  i=boyut-1; i>=0; i--)
            document.write(kelime[i]+"<br>");
        
        
    </script>
  </body>
</html>
