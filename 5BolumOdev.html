  <body>
    <script>
        //1. Soru
      var sayi =Number(prompt("Bir sayı gir: "));
      var sonuc = sayi+1;
      document.write("<b>" + sonuc + "</b>");

        //2. Soru
        var sayi1=Number(prompt("1.sayiyi gir: "));
        var sayi2=Number(prompt("2.sayiyi gir: "));
        var sayi3=Number(prompt("3.sayıyı gir: "));

        var ortalama = (sayi1+ sayi2 + sayi3 ) /3;
        alert("üç sayının ortalaması: "+ortalama);
        
    </script>
