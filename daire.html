<!DOCTYPE html>
<html>
  <head>
    <meta charset ="utf-8">;
  </head>
  <body>
    <script>
        // değişkenler
        var r,alan,cevre,pi=3.14;

        //yarı çapı 
        r=Number(prompt("Yarıçapı: "));

        //alan ve çevre hessapla
        alan=pi*r*r;
        cevre=2*pi*2;
        //alan ve cevreyi yaz 
        alert("Alan="+alan+"Çevre= "+cevre);
        
        
    </script>
  </body>
</html>
