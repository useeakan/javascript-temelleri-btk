<!DOCTYPE html>
<html>
  <head>
    <meta charset ="utf-8">;
  </head>
  <body>
    <script>
        //değişkenler
        var s,n;

        //n değeri
        n=number(prompt("n:"));
         
        // for döngüsü
        for(s=0, s<=n; s=s+5;)
            document.write(s+"<br>");

            //while
            s=0; 
            while(s<=n){
                document.write(s+"<br>");
                s=s+5;
            }
        
    </script>
  </body>
</html>
