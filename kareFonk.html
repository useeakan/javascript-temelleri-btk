  <body>
    <script>
        function kare(a){
            var kare=a*a;
            return kare;
        }
// ekrandan değer aldım
        var sayi=Number(prompt("sayi:"));
// kare hesabı
        var karesi=kare(sayi);
// ekrana yaz
        alert("1Sayının karesi="+karesi);
        
    </script>
  </body>
